name: CI y Deploy Backend

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Instalar dependencias
        working-directory: backend
        run: pip install -r requirements.lock

      - name: Construir la imagen del sandbox
        working-directory: backend/docker
        run: docker build -t tutor-ugr-image:latest .

      # Los tests marcados `llm` necesitan claves reales de Gemini/Groq y se excluyen
      - name: Tests (sin LLM)
        working-directory: backend
        run: pytest tests/ -m "not llm" -v

  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build (tsc + vite)
        working-directory: frontend
        run: npm run build

  deploy:
    needs: [backend-tests, frontend-checks]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Si falla algún paso (p. ej. pip) se corta aquí y el backend sigue con la versión anterior
            set -e
            cd ~/tutor-ai
            # fetch + reset: sigue funcionando aunque se reescriba el historial de main
            git fetch origin main
            git reset --hard origin/main
            
            # Construir imagen Docker segura con usuario alumno (no-root)
            cd ~/tutor-ai/backend/docker
            docker build -t tutor-ugr-image:latest .
            
            # actulizar python
            cd ~/tutor-ai/backend
            [ -d venv ] || python3 -m venv venv
            source venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.lock
            
            # reiniciar servicios
            pm2 restart backend || pm2 start "./venv/bin/python3 -m uvicorn main:app --host 0.0.0.0 --port 8000" --name backend
            pm2 restart ngrok || pm2 start "ngrok http --domain=${{ secrets.NGROK_DOMAIN }} 8000" --name ngrok
            
            pm2 save
            exit 0